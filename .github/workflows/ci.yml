name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  browser:
    name: Browser tests (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7

  electron:
    name: Electron tests (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # A third-party package list on the runner image (packages.microsoft.com) sometimes
      # fails to refresh, which makes `apt-get update` fail before any test runs. xvfb
      # comes from Ubuntu's own lists, so carry on if only some lists failed, and skip
      # apt entirely when the image already has xvfb.
      - name: Install xvfb
        run: |
          if command -v xvfb-run >/dev/null; then echo "xvfb-run is already installed"; exit 0; fi
          sudo apt-get update || echo "::warning::some package lists failed to refresh; installing xvfb anyway"
          sudo apt-get install -y xvfb
      - run: npm ci
      - run: npm run test:electron
      - name: Build the app unpacked and test the build
        run: npm run dist:dir && npm run test:packaged
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-test-results
          path: test-results/
          retention-days: 7

  # The Windows checks are two jobs that run at the same time: the app's tests, and the
  # installer build with the built app's tests (the build alone takes about 3 minutes).
  windows-app:
    name: Windows app tests (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The real foreground and battery monitor script under PowerShell
        run: node --test test/windows/foreground.test.js
      - name: Electron tests
        run: npm run test:electron
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-test-results
          path: test-results/
          retention-days: 7

  windows-installer:
    name: Windows installer (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the installer and the portable app
        run: npm run dist:win
      - name: Test the built app, including the foreground-app monitor
        run: npm run test:packaged
      - name: Upload the installer and the portable app
        uses: actions/upload-artifact@v4
        with:
          name: desktop-pet-windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-test-results
          path: test-results/
          retention-days: 7
