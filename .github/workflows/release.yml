name: Release

# Publishes a GitHub Release of the version in package.json. Either:
#   - Actions tab → Release → Run workflow, on main. It tags the commit v<version> itself.
#   - or push a version tag yourself: git tag v1.2.0 && git push origin v1.2.0
# Before either: npm version 1.2.0 --no-git-tag-version, add a "## [1.2.0] - date"
# CHANGELOG entry, and merge to main.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, test and publish (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Work out the tag
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Run the release on main."; exit 1
            fi
            tag="v$(node -p "require('./package.json').version")"
            # A tag that already exists must be this commit: a released version never moves.
            if git fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null \
              && [ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]; then
              echo "::error::$tag is already another commit. Raise the version first."; exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Check the tag matches package.json and has a CHANGELOG entry
        shell: bash
        run: node scripts/release.js check "$TAG"
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: The real foreground and battery monitor script under PowerShell
        run: node --test test/windows/foreground.test.js
      - name: Electron tests
        run: npm run test:electron
      - name: Build the installer and the portable app
        run: npm run dist:win
      - name: Test the built app
        run: npm run test:packaged
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          mkdir -p release
          # Stable names, so releases/latest/download/DesktopPet-Setup.exe always works.
          cp "dist/DesktopPet-Setup-${version}.exe" release/DesktopPet-Setup.exe
          cp "dist/DesktopPet-${version}-portable.exe" release/DesktopPet-Portable.exe
          node scripts/release.js notes "$version" > release/notes.md
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/DesktopPet-Setup.exe release/DesktopPet-Portable.exe --clobber
            gh release edit "$TAG" --title "Desktop Pet $version" --notes-file release/notes.md
          else
            # Creates the tag on this commit if it doesn't exist yet (Run workflow).
            gh release create "$TAG" release/DesktopPet-Setup.exe release/DesktopPet-Portable.exe \
              --title "Desktop Pet $version" --notes-file release/notes.md \
              --target "$GITHUB_SHA" $prerelease
          fi
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: test-results/
          retention-days: 7
